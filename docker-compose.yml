services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maintenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintenance}
      POSTGRES_DB: ${POSTGRES_DB:-maintenance_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maintenance} -d ${POSTGRES_DB:-maintenance_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: core-runtime
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      STORAGE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maintenance}:${POSTGRES_PASSWORD:-maintenance}@postgres:5432/${POSTGRES_DB:-maintenance_copilot}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: rag-runtime
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      STORAGE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maintenance}:${POSTGRES_PASSWORD:-maintenance}@postgres:5432/${POSTGRES_DB:-maintenance_copilot}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-maintenance_knowledge}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-small}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-80}
      RAG_DENSE_CANDIDATES: ${RAG_DENSE_CANDIDATES:-20}
      RAG_SPARSE_CANDIDATES: ${RAG_SPARSE_CANDIDATES:-20}
      RAG_FUSED_CANDIDATES: ${RAG_FUSED_CANDIDATES:-20}
      RAG_FINAL_TOP_K: ${RAG_FINAL_TOP_K:-5}
      RAG_RELEVANCE_THRESHOLD: ${RAG_RELEVANCE_THRESHOLD:-0.55}
      RAG_DENSE_WEIGHT: ${RAG_DENSE_WEIGHT:-0.50}
      RAG_SPARSE_WEIGHT: ${RAG_SPARSE_WEIGHT:-0.50}
      RAG_RETRIEVAL_WEIGHT: ${RAG_RETRIEVAL_WEIGHT:-0.55}
      RAG_RERANKER_WEIGHT: ${RAG_RERANKER_WEIGHT:-0.40}
      RAG_METADATA_WEIGHT: ${RAG_METADATA_WEIGHT:-0.05}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      RAG_RERANKER_DEVICE: ${RAG_RERANKER_DEVICE:-auto}
      RAG_SPARSE_MAX_CHUNKS: ${RAG_SPARSE_MAX_CHUNKS:-10000}
      RAG_DEBUG_ENABLED: ${RAG_DEBUG_ENABLED:-false}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      COPILOT_RATE_LIMIT_REQUESTS: ${COPILOT_RATE_LIMIT_REQUESTS:-20}
      COPILOT_RATE_LIMIT_WINDOW_SECONDS: ${COPILOT_RATE_LIMIT_WINDOW_SECONDS:-60}
      ATTACHMENT_STORAGE_BACKEND: local
      ATTACHMENT_STORAGE_ROOT: /app/data/attachments
      ATTACHMENT_MAX_SIZE_BYTES: ${ATTACHMENT_MAX_SIZE_BYTES:-10485760}
      ANALYTICS_SOURCE_DIR: /app/data/raw
      ANALYTICS_PROCESSED_DIR: /app/data/processed
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_MAX_CONTEXT_CHARS: ${LLM_MAX_CONTEXT_CHARS:-12000}
      LLM_MIN_RELEVANT_DOCUMENTS: ${LLM_MIN_RELEVANT_DOCUMENTS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-maintenance_csrf}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
      target: core-runtime
    command: ["python", "-m", "src.operations.worker"]
    environment:
      STORAGE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maintenance}:${POSTGRES_PASSWORD:-maintenance}@postgres:5432/${POSTGRES_DB:-maintenance_copilot}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_STATEMENT_TIMEOUT_SECONDS: ${DATABASE_STATEMENT_TIMEOUT_SECONDS:-30}
      DATABASE_LOCK_TIMEOUT_SECONDS: ${DATABASE_LOCK_TIMEOUT_SECONDS:-5}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_SECONDS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_SECONDS:-60}
      ANALYTICS_SOURCE_DIR: /app/data/raw
      ANALYTICS_PROCESSED_DIR: /app/data/processed
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-60}
      WORKER_OUTBOX_LEASE_SECONDS: ${WORKER_OUTBOX_LEASE_SECONDS:-120}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from src.operations.service import build_operations_service; assert build_operations_service().worker_health()['ready']",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  postgres_data:
  qdrant_data:
