services:
  postgres:
    image: postgres:16-alpine
    container_name: maintenance_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maintenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintenance}
      POSTGRES_DB: ${POSTGRES_DB:-maintenance_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maintenance} -d ${POSTGRES_DB:-maintenance_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: maintenance_qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.operations.worker"]
    environment:
      STORAGE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maintenance}:${POSTGRES_PASSWORD:-maintenance}@postgres:5432/${POSTGRES_DB:-maintenance_copilot}
      APP_ENVIRONMENT: development
      ANALYTICS_SOURCE_DIR: /app/data/raw
      ANALYTICS_PROCESSED_DIR: /app/data/processed
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from src.operations.service import build_operations_service; assert build_operations_service().worker_health()['ready']",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  postgres_data:
  qdrant_data:
