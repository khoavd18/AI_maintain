version: 2

models:
  - name: stg_sites
    description: One deterministic latest raw version per site UUID.
    columns:
      - name: site_id
        description: Stable source location UUID used as the analytical site identifier.
        data_tests: [not_null, unique]
      - name: site_code
        data_tests: [not_null, unique]
      - name: site_name
        data_tests: [not_null]
      - name: location_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [building, floor, room, area, plant]
      - name: parent_site_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sites')
                field: site_id
      - name: is_active
        data_tests: [not_null]
      - name: source_created_at
        data_tests: [not_null]
      - name: source_updated_at
        data_tests: [not_null]
      - name: ingestion_batch_id
        data_tests: [not_null]
      - name: source_extracted_at
        data_tests: [not_null]
      - name: ingested_at
        data_tests: [not_null]

  - name: stg_assets
    description: One deterministic latest raw version per text asset identifier.
    columns:
      - name: asset_id
        description: Stable application asset identifier; intentionally remains text.
        data_tests: [not_null, unique]
      - name: asset_name
        data_tests: [not_null]
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sites')
                field: site_id
      - name: asset_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hvac, pump, generator]
      - name: criticality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, medium, high, critical]
      - name: lifecycle_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [planned, active, inactive, retired, archived]
      - name: operational_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [running, warning, fault, under_maintenance, out_of_service]
      - name: installed_at
        data_tests: [not_null]
      - name: source_created_at
        data_tests: [not_null]
      - name: source_updated_at
        data_tests: [not_null]
      - name: ingestion_batch_id
        data_tests: [not_null]
      - name: source_extracted_at
        data_tests: [not_null]
      - name: ingested_at
        data_tests: [not_null]

  - name: stg_technicians
    description: One deterministic latest raw version per assignable user UUID.
    columns:
      - name: technician_id
        description: User UUID used by work_orders.assigned_to_user_id.
        data_tests: [not_null, unique]
      - name: employee_code
        data_tests: [not_null, unique]
      - name: display_name
        data_tests: [not_null]
      - name: role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - administrator
                  - property_manager
                  - chief_engineer
                  - technician
                  - helpdesk
                  - storekeeper
      - name: is_active
        data_tests: [not_null]
      - name: source_created_at
        data_tests: [not_null]
      - name: source_updated_at
        data_tests: [not_null]
      - name: ingestion_batch_id
        data_tests: [not_null]
      - name: source_extracted_at
        data_tests: [not_null]
      - name: ingested_at
        data_tests: [not_null]

  - name: stg_work_orders
    description: >
      Latest known raw version of each work-order UUID. Equal update timestamps
      are ordered stably by extraction, ingestion, and batch UUID metadata.
    columns:
      - name: work_order_id
        description: Stable application work-order UUID.
        data_tests: [not_null, unique]
      - name: work_order_number
        data_tests: [not_null, unique]
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sites')
                field: site_id
      - name: asset_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_id
      - name: assigned_technician_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_technicians')
                field: technician_id
      - name: work_order_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [preventive, corrective, inspection, emergency]
      - name: priority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, medium, high, critical]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [planned, assigned, in_progress, on_hold, completed, verified, cancelled]
      - name: title
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]
      - name: due_date
        data_tests: [not_null]
      - name: estimated_duration_minutes
        data_tests: [not_null]
      - name: estimated_cost
        description: >
          Nullable compatibility placeholder populated as NULL by the current
          analytics_source view because target work orders have no cost field.
      - name: actual_cost
        description: >
          Nullable compatibility placeholder populated as NULL by the current
          analytics_source view because target work orders have no cost field.
      - name: source_updated_at
        data_tests: [not_null]
      - name: ingestion_batch_id
        data_tests: [not_null]
      - name: source_extracted_at
        data_tests: [not_null]
      - name: ingested_at
        data_tests: [not_null]
      - name: source_system
        data_tests: [not_null]
