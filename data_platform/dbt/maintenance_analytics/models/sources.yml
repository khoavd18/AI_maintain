version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Version-preserving analytical landing tables. The ingestion boundary reads
      the stable analytics_source compatibility views rather than coupling dbt to
      application ORM tables. UUID and text business identifiers are preserved.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: sites
        description: Versioned site/location records loaded from analytics_source.sites.
        columns:
          - name: ingestion_batch_id
            data_tests: [not_null]
          - name: site_id
            data_tests: [not_null]
          - name: site_code
            data_tests: [not_null]
          - name: site_name
            data_tests: [not_null]
          - name: location_type
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [building, floor, room, area, plant]
          - name: is_active
            data_tests: [not_null]
          - name: source_created_at
            data_tests: [not_null]
          - name: source_updated_at
            data_tests: [not_null]
          - name: source_extracted_at
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]

      - name: assets
        description: Versioned asset records loaded from analytics_source.assets.
        columns:
          - name: ingestion_batch_id
            data_tests: [not_null]
          - name: asset_id
            data_tests: [not_null]
          - name: asset_name
            data_tests: [not_null]
          - name: site_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'sites')
                    field: site_id
          - name: asset_type
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [hvac, pump, generator]
          - name: criticality
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [low, medium, high, critical]
          - name: lifecycle_status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [planned, active, inactive, retired, archived]
          - name: operational_status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [running, warning, fault, under_maintenance, out_of_service]
          - name: installed_at
            data_tests: [not_null]
          - name: source_created_at
            data_tests: [not_null]
          - name: source_updated_at
            data_tests: [not_null]
          - name: source_extracted_at
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]

      - name: technicians
        description: Versioned assignable user records loaded from analytics_source.technicians.
        columns:
          - name: ingestion_batch_id
            data_tests: [not_null]
          - name: technician_id
            data_tests: [not_null]
          - name: employee_code
            data_tests: [not_null]
          - name: display_name
            data_tests: [not_null]
          - name: role
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - administrator
                      - property_manager
                      - chief_engineer
                      - technician
                      - helpdesk
                      - storekeeper
          - name: is_active
            data_tests: [not_null]
          - name: source_created_at
            data_tests: [not_null]
          - name: source_updated_at
            data_tests: [not_null]
          - name: source_extracted_at
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]

      - name: work_orders
        description: >
          Append-only source versions for incremental work orders. The uniqueness
          boundary is (work_order_id, source_updated_at); ingestion batches may
          contain different versions of the same UUID.
        config:
          freshness: null
        columns:
          - name: ingestion_batch_id
            data_tests: [not_null]
          - name: work_order_id
            data_tests: [not_null]
          - name: work_order_number
            data_tests: [not_null]
          - name: site_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'sites')
                    field: site_id
          - name: asset_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'assets')
                    field: asset_id
          - name: assigned_technician_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'technicians')
                    field: technician_id
          - name: work_order_type
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [preventive, corrective, inspection, emergency]
          - name: priority
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [low, medium, high, critical]
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [planned, assigned, in_progress, on_hold, completed, verified, cancelled]
          - name: title
            data_tests: [not_null]
          - name: created_at
            data_tests: [not_null]
          - name: due_date
            data_tests: [not_null]
          - name: estimated_duration_minutes
            data_tests: [not_null]
          - name: source_updated_at
            data_tests: [not_null]
          - name: source_extracted_at
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]
          - name: source_system
            data_tests: [not_null]
