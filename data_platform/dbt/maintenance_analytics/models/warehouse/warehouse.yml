version: 2

models:
  - name: dim_site
    description: >
      Current-state site dimension (SCD1 semantics), plus one typed unknown UUID
      member for defensive fact relationships.
    columns:
      - name: site_key
        data_tests: [not_null, unique]
      - name: site_id
        data_tests: [not_null, unique]
      - name: site_code
        data_tests: [not_null, unique]
      - name: site_name
        data_tests: [not_null]
      - name: location_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [building, floor, room, area, plant, UNKNOWN]
      - name: parent_site_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_id
      - name: is_active
        data_tests: [not_null]
      - name: dbt_loaded_at
        data_tests: [not_null]

  - name: dim_asset
    description: >
      Current-state asset dimension enriched with its current site, plus one
      typed unknown text-ID member.
    columns:
      - name: asset_key
        data_tests: [not_null, unique]
      - name: asset_id
        data_tests: [not_null, unique]
      - name: asset_name
        data_tests: [not_null]
      - name: site_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_key
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_id
      - name: site_code
        data_tests: [not_null]
      - name: site_name
        data_tests: [not_null]
      - name: asset_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hvac, pump, generator, UNKNOWN]
      - name: criticality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, medium, high, critical, UNKNOWN]
      - name: lifecycle_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [planned, active, inactive, retired, archived, UNKNOWN]
      - name: operational_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [running, warning, fault, under_maintenance, out_of_service, UNKNOWN]
      - name: dbt_loaded_at
        data_tests: [not_null]

  - name: dim_technician
    description: >
      Current-state assignable-user dimension, plus one UUID unknown member used
      for genuinely unassigned work orders.
    columns:
      - name: technician_key
        data_tests: [not_null, unique]
      - name: technician_id
        data_tests: [not_null, unique]
      - name: employee_code
        data_tests: [not_null, unique]
      - name: display_name
        data_tests: [not_null]
      - name: role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - administrator
                  - property_manager
                  - chief_engineer
                  - technician
                  - helpdesk
                  - storekeeper
                  - UNKNOWN
      - name: is_active
        data_tests: [not_null]
      - name: dbt_loaded_at
        data_tests: [not_null]

  - name: dim_date
    description: >
      Calendar dimension spanning complete years around all work-order dates and
      five future years, plus date key 0 for optional timestamps.
    columns:
      - name: date_key
        data_tests: [not_null, unique]
      - name: date_day
        data_tests: [not_null, unique]
      - name: year_number
        data_tests: [not_null]
      - name: quarter_number
        data_tests: [not_null]
      - name: month_number
        data_tests: [not_null]
      - name: month_name
        data_tests: [not_null]
      - name: month_start_date
        data_tests: [not_null]
      - name: week_number
        data_tests: [not_null]
      - name: day_of_month
        data_tests: [not_null]
      - name: day_of_week
        data_tests: [not_null]
      - name: day_name
        data_tests: [not_null]
      - name: is_weekend
        data_tests: [not_null]
      - name: dbt_loaded_at
        data_tests: [not_null]

  - name: fact_work_order
    description: >
      Incremental accumulating-snapshot fact at one row per work_order_id. New
      and changed rows advance through the stable
      (source_updated_at, work_order_id) tuple. Current target work orders have
      no canonical cost fields, so all cost compatibility columns remain
      nullable and must not be presented as accounting or maintenance-cost data.
    columns:
      - name: work_order_key
        data_tests: [not_null, unique]
      - name: work_order_id
        data_tests: [not_null, unique]
      - name: work_order_number
        data_tests: [not_null, unique]
      - name: site_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_key
      - name: asset_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: asset_key
      - name: technician_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_technician')
                field: technician_key
      - name: created_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: scheduled_start_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: started_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: completed_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: due_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_id
      - name: asset_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: asset_id
      - name: assigned_technician_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_technician')
                field: technician_id
      - name: work_order_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [preventive, corrective, inspection, emergency]
      - name: priority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, medium, high, critical]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [planned, assigned, in_progress, on_hold, completed, verified, cancelled]
      - name: title
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]
      - name: due_date
        data_tests: [not_null]
      - name: estimated_duration_minutes
        data_tests: [not_null]
      - name: estimated_cost
        description: >
          Nullable compatibility placeholder. The target OLTP work_orders table
          has no canonical estimated-cost field, so current rows are NULL.
      - name: actual_cost
        description: >
          Nullable compatibility placeholder. The target OLTP work_orders table
          has no canonical actual-cost field, so current rows are NULL.
      - name: cost_variance
        description: >
          Nullable actual_cost minus estimated_cost when both values exist.
          Current target rows are NULL because neither canonical input exists.
      - name: is_over_budget
        description: Nullable for the current target because canonical costs are unavailable.
      - name: work_order_count
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
      - name: completed_work_order_count
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: critical_work_order_count
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: unassigned_work_order_count
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: source_updated_at
        data_tests: [not_null]
      - name: ingestion_batch_id
        data_tests: [not_null]
      - name: source_extracted_at
        data_tests: [not_null]
      - name: source_ingested_at
        data_tests: [not_null]
      - name: source_system
        data_tests: [not_null]
      - name: dbt_loaded_at
        data_tests: [not_null]
